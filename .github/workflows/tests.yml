name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_page_updates.cjs
      - run: node tests/test_live_updates.cjs
      - run: node tests/test_speech.cjs
  builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./internal/release -out dist
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-candidates
          path: dist/*
  legacy-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The previous implementation is a development oracle, never a product dependency.
      - run: python -m unittest discover -s tests -v
