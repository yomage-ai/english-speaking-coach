name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_page_updates.cjs
      - run: node tests/test_live_updates.cjs
      - run: node tests/test_speech.cjs
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify pinned tag
        shell: bash
        run: test "$(cat runtime-version.txt)" = "$GITHUB_REF_NAME"
      - run: go run ./internal/release -out dist
      - name: Publish standalone programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "English Speaking Coach $GITHUB_REF_NAME" --notes-file references/release-notes.md --verify-tag
